<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard | Puro Llano Radio 🤠</title>
    <meta name="description" content="Panel de control para artistas llaneros - Gestiona tu perfil y contrataciones.">
    
    <link rel="icon" href="PUROLLANORADIO-COM-ICONO.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="talento.css">
    <link rel="stylesheet" href="perfil-artista.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="./firebase-simple.js"></script>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    
    <div class="container">
        <nav class="top-nav">
            <a href="talento.html" class="btn-back">
                <i class="fa fa-home"></i> Volver al Muro
            </a>
            <div class="nav-branding">
                <i class="fa fa-tachometer-alt"></i> Mi Dashboard
            </div>
            <div class="auth-buttons">
                <div class="user-info-bar show" id="userInfo">
                    <div class="user-avatar-small" id="userAvatar">U</div>
                    <span class="user-name-text" id="userNameDisplay">Usuario</span>
                    <button class="btn-logout" id="logoutBtn">
                        <i class="fa fa-sign-out-alt"></i> Salir
                    </button>
                </div>
            </div>
        </nav>
        
        <div id="dashboardContent">
            <div class="loading-state">
                <i class="fa fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 15px;">Cargando tu dashboard...</p>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="toast-container"></div>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        let currentUser = null;
        let db;
        let auth;
        
        try {
            auth = firebase.auth();
            db = firebase.database();
        } catch(e) {
            console.error('Firebase no disponible:', e);
            return;
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="glass-panel" style="text-align: center; padding: 50px;">
                        <i class="fa fa-lock" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
                        <h2 style="color: var(--primary);">Acceso Restringido</h2>
                        <p style="color: var(--text-muted);">Debes iniciar sesión para acceder a tu dashboard.</p>
                        <button class="btn-back" onclick="window.location.href='perfil-artista.html'" style="display: inline-flex; margin-top: 20px;">
                            <i class="fa fa-sign-in-alt"></i> Iniciar Sesión
                        </button>
                    </div>
                `;
                return;
            }
            
            currentUser = user;
            window.currentUser = user;
            
            const displayName = user.displayName || user.email.split('@')[0];
            document.getElementById('userNameDisplay').textContent = displayName;
            document.getElementById('userAvatar').textContent = displayName.charAt(0).toUpperCase();
            
            await loadDashboard(user.uid);
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = 'talento.html';
        });

        async function loadDashboard(uid) {
            try {
                const perfilSnapshot = await db.ref('perfiles/' + uid).once('value');
                const perfil = perfilSnapshot.val();
                
                const contratacionesSnapshot = await db.ref('contrataciones')
                    .orderByChild('artistaId')
                    .equalTo(uid)
                    .once('value');
                
                const contrataciones = contratacionesSnapshot.val() || {};
                const contratosArray = Object.entries(contrataciones).map(([id, data]) => ({
                    id,
                    ...data
                }));
                
                const contratosPendientes = contratosArray.filter(c => c.estado === 'pendiente');
                const contratosConfirmados = contratosArray.filter(c => c.estado === 'confirmado');
                
                const visitas = perfil?.visitasPerfil || 0;
                
                renderDashboard(perfil, {
                    total: Object.keys(contrataciones).length,
                    pendientes: contratosPendientes.length,
                    confirmados: contratosConfirmados.length
                }, uid, visitas);
                
            } catch (error) {
                console.error('Error cargando dashboard:', error);
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="glass-panel" style="text-align: center; padding: 50px;">
                        <i class="fa fa-exclamation-circle" style="font-size: 3rem; color: var(--danger);"></i>
                        <p>Error al cargar datos</p>
                    </div>
                `;
            }
        }

        function renderDashboard(perfil, stats, uid, visitas) {
            const nombreArtistico = perfil?.nombreArtistico || 'Artista';
            const profileComplete = perfil?.perfilCompleto || false;
            
            const profileUrl = `${window.location.origin}/perfil-publico.html?id=${uid}`;
            
            let contractsHTML = '';
            
            if (stats.total === 0) {
                contractsHTML = `
                    <div style="text-align: center; padding: 30px; color: var(--text-muted);">
                        <i class="fa fa-inbox" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
                        <p>Aún no has recibido solicitudes de contratación.</p>
                    </div>
                `;
            } else {
                contractsHTML = `
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        ${stats.pendientes > 0 ? `
                            <div style="background: rgba(255, 165, 0, 0.15); border: 1px solid orange; border-radius: 10px; padding: 15px;">
                                <h4 style="color: orange; margin-bottom: 10px;"><i class="fa fa-clock"></i> ${stats.pendientes} Solicitud(es) Pendiente(s)</h4>
                                <p style="font-size: 0.9rem; color: var(--text-muted);">Revisa y contacta a los interesados.</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            const html = `
                <div class="dashboard-container">
                    <div class="dashboard-header">
                        <div class="dashboard-welcome">
                            <h1>¡Bienvenido, ${nombreArtistico}! 🎸</h1>
                            <p>Gestiona tu perfil y observa cómo grows tu popularidad</p>
                        </div>
                        <div class="dashboard-stats">
                            <div class="stat-item">
                                <span class="stat-value">${stats.total}</span>
                                <span class="stat-label">Solicitudes</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">${visitas}</span>
                                <span class="stat-label">Visitas</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">${stats.pendientes}</span>
                                <span class="stat-label">Pendientes</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h3><i class="fa fa-user-circle"></i> Mi Perfil</h3>
                            <div style="margin-bottom: 15px;">
                                ${profileComplete ? `
                                    <span style="color: var(--success);"><i class="fa fa-check-circle"></i> Perfil completo</span>
                                ` : `
                                    <span style="color: orange;"><i class="fa fa-exclamation-circle"></i> Perfil incompleto</span>
                                `}
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                <a href="perfil-artista.html" class="btn-back" style="text-align: center;">
                                    <i class="fa fa-edit"></i> ${profileComplete ? 'Editar Perfil' : 'Completar Perfil'}
                                </a>
                                <a href="${profileUrl}" target="_blank" class="btn-back" style="background: var(--dark-elevated); text-align: center;">
                                    <i class="fa fa-external-link-alt"></i> Ver Mi Perfil Público
                                </a>
                            </div>
                        </div>
                        
                        <div class="dashboard-card">
                            <h3><i class="fa fa-share-alt"></i> Compartir Mi Perfil</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Comparte tu perfil para que más personas puedan contactarte.</p>
                            <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                                <code style="font-size: 0.8rem; word-break: break-all;">${profileUrl}</code>
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="btn-back" onclick="copyToClipboard('${profileUrl}')" style="flex: 1; justify-content: center; min-width: 120px;">
                                    <i class="fa fa-copy"></i> Copiar
                                </button>
                                <button class="btn-back" onclick="shareMyProfile()" style="flex: 1; justify-content: center; background: #1877f2; min-width: 120px;">
                                    <i class="fa fa-facebook"></i> Facebook
                                </button>
                                <button class="btn-back" onclick="shareProfileWhatsApp()" style="flex: 1; justify-content: center; background: #25d366; min-width: 120px;">
                                    <i class="fa fa-whatsapp"></i> WhatsApp
                                </button>
                            </div>
                        </div>
                        
                        <div class="dashboard-card">
                            <h3><i class="fa fa-bullhorn"></i> Promocionar en Redes</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Genera textos para promocionate en tus redes sociales.</p>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                <a href="creador-contenido.html" class="btn-back" style="justify-content: center; background: linear-gradient(135deg, #9c27b0 0%, #673ab7 100%);">
                                    <i class="fa fa-robot"></i> 🎨 Creador de Contenido IA
                                </a>
                                <button class="btn-back" onclick="generateSocialPost('facebook')" style="background: #1877f2; justify-content: center;">
                                    <i class="fa fa-facebook"></i> Generar para Facebook
                                </button>
                                <button class="btn-back" onclick="generateSocialPost('instagram')" style="background: linear-gradient(45deg, #f09433, #dc2743); justify-content: center;">
                                    <i class="fa fa-instagram"></i> Generar para Instagram
                                </button>
                                <button class="btn-back" onclick="generateSocialPost('whatsapp')" style="background: #25d366; justify-content: center;">
                                    <i class="fa fa-whatsapp"></i> Generar para WhatsApp
                                </button>
                            </div>
                        </div>
                        
                        <div class="dashboard-card" style="grid-column: 1 / -1;">
                            <h3><i class="fa fa-handshake"></i> Solicitudes de Contratación</h3>
                            ${contractsHTML}
                        </div>
                        
                        <div class="dashboard-card" style="grid-column: 1 / -1;">
                            <h3><i class="fa fa-chart-line"></i> Estadísticas de Tu Perfil</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 15px;">
                                <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; text-align: center;">
                                    <i class="fa fa-eye" style="font-size: 2rem; color: var(--primary); margin-bottom: 10px;"></i>
                                    <div style="font-size: 2rem; font-weight: 800; color: var(--primary);">${visitas}</div>
                                    <div style="color: var(--text-muted);">Personas han visto tu perfil</div>
                                </div>
                                <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; text-align: center;">
                                    <i class="fa fa-envelope" style="font-size: 2rem; color: var(--whatsapp); margin-bottom: 10px;"></i>
                                    <div style="font-size: 2rem; font-weight: 800; color: var(--whatsapp);">${stats.total}</div>
                                    <div style="color: var(--text-muted);">Solicitudes recibidas</div>
                                </div>
                                <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; text-align: center;">
                                    <i class="fa fa-percentage" style="font-size: 2rem; color: var(--success); margin-bottom: 10px;"></i>
                                    <div style="font-size: 2rem; font-weight: 800; color: var(--success);">${profileComplete ? '100%' : '50%'}</div>
                                    <div style="color: var(--text-muted);">Perfil completado</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('dashboardContent').innerHTML = html;
        }

        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                window.showToast('Enlace copiado al portapapeles', 'fa-copy');
            });
        };

        window.generateSocialPost = function(platform) {
            const postTexts = {
                facebook: `🔥 ¡Nuevo talento llanero en Puro Llano Radio! 🔥

¡Les presento mi nuevo perfil profesional! Ahora puedes encontrar toda mi música, videos y contactarme directamente para eventos y festivales.

🇻🇪🇨🇴 #MúsicaLlanera #Folklore #PuroLlanoRadio #TalentoLlanero`,

                instagram: `🎶 ¡Les presento mi nuevo perfil! 🎶

Ahora puedes encontrar toda mi música llanera y contactarme directamente para eventos. 🇻🇪🇨🇴

🔗 Link en bio 🔗

#MúsicaLlanera #Joropo #PuroLlanoRadio #TalentoLlanero #Folklore`,

                whatsapp: `🎤 ¡Saludos familia llanera! 🎤

Les comparto mi nuevo perfil en Puro Llano Radio donde pueden ver toda mi música, videos y contactarme para eventos:

[ENLACE_A_TU_PERFIL]

¡Gracias por su apoyo! 🇻🇪🇨🇴`
            };
            
            const postText = postTexts[platform];
            if (postText) {
                navigator.clipboard.writeText(postText).then(() => {
                    window.showToast(`Texto para ${platform} copiado! Pégalo en tu статус`, 'fa-check');
                });
            }
        };

        window.shareMyProfile = function() {
            const nombre = perfil?.nombreArtistico || 'Artista';
            const region = perfil?.region || 'los llanos';
            const instrumentos = perfil?.instrumentos?.join(', ') || 'música llanera';
            const url = `${window.location.origin}/perfil-publico.html?id=${uid}`;
            
            const texto = `🎵 ¡Descubre a ${nombre}! 🎵\n\nArtista llanero de ${region}, especializado en ${instrumentos}.\n\nEscucha su música y síguelo en Puro Llano Radio:\n${url}\n\n🇻🇪🇨🇴 #MúsicaLlanera #Folklore #PuroLlanoRadio`;
            
            const encodedText = encodeURIComponent(texto);
            window.open(`https://www.facebook.com/sharer/sharer.php?quote=${encodedText}&u=${encodeURIComponent(url)}`, '_blank');
        };

        window.shareProfileWhatsApp = function() {
            const nombre = perfil?.nombreArtistico || 'Artista';
            const region = perfil?.region || 'los llanos';
            const instrumentos = perfil?.instrumentos?.join(', ') || 'música llanera';
            const url = `${window.location.origin}/perfil-publico.html?id=${uid}`;
            
            const texto = `🎤 *NUEVO TALENTO LLANERO*\n\n*${nombre}* de ${region}\n\n${instrumentos}\n\nEscúchalo aquí:\n${url}\n\n🇻🇪🇨🇴 *La música nos une*`;
            
            const encodedText = encodeURIComponent(texto);
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
        };

        window.shareProfileInstagram = function() {
            const nombre = perfil?.nombreArtistico || 'Artista';
            const region = perfil?.region || 'los llanos';
            
            const texto = `🎶 ${nombre} 🔥\n\nDe ${region} para el mundo 🌎\n\n#YoEscuchoPuroLlanoRadio #MúsicaLlanera #Joropo #Folklore`;
            
            navigator.clipboard.writeText(texto).then(() => {
                window.showToast('Texto copiado. Pégalo en tu historia de Instagram', 'fa-instagram');
                window.open('https://instagram.com', '_blank');
            });
        };

        window.shareProfileTwitter = function() {
            const nombre = perfil?.nombreArtistico || 'Artista';
            const region = perfil?.region || 'los llanos';
            const url = `${window.location.origin}/perfil-publico.html?id=${uid}`;
            
            const texto = `🎵 ${nombre} - Artista Llanero de ${region}\n\nEscucha su música en @PuroLlanoRadio: ${url}\n\n#MúsicaLlanera #Joropo #Folklore`;
            
            const encodedText = encodeURIComponent(texto);
            window.open(`https://twitter.com/intent/tweet?text=${encodedText}`, '_blank');
        };
    });
    </script>
</body>
</html>
